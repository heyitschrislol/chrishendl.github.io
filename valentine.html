<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Will You Be My Valentine?</title>

<style>
    body{
        margin:0;
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:linear-gradient(135deg,#ff4d6d,#ff8fab);
        font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
        overflow:hidden;
    }

    .card{
        background:white;
        padding:60px 80px;
        border-radius:20px;
        text-align:center;
        box-shadow:0 20px 60px rgba(0,0,0,.2);
    }

    h1{
        margin-bottom:40px;
        font-size:2.4rem;
    }

    button{
        font-size:1.2rem;
        padding:14px 28px;
        border:none;
        border-radius:12px;
        cursor:pointer;
        transition:.25s;
        margin:10px;
    }

    #yes{
        background:#ff4d6d;
        color:white;
    }

    #yes:hover{
        transform:scale(1.08);
    }

    #no{
        background:#eee;
        position:absolute;
    }
</style>
</head>

<body>

<div class="card">
    <h1>Will you be my Valentine? ❤️</h1>
    <button id="yes" onclick="sayYes()">Yes</button>
    <button id="no">No</button>
</div>

<script>

const noBtn = document.getElementById("no");

document.addEventListener("mousemove", (e) => {

    const rect = noBtn.getBoundingClientRect();

    const distance = Math.hypot(
        e.clientX - (rect.left + rect.width/2),
        e.clientY - (rect.top + rect.height/2)
    );

    // When cursor gets close, teleport the button
    if(distance < 120){
        const maxX = window.innerWidth - rect.width;
        const maxY = window.innerHeight - rect.height;

        noBtn.style.left = Math.random() * maxX + "px";
        noBtn.style.top  = Math.random() * maxY + "px";
    }
});

function sayYes(){
    document.body.innerHTML = `
        <div style="
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            font-family:sans-serif;
            background:linear-gradient(135deg,#ff4d6d,#ff8fab);
            color:white;
            text-align:center;
        ">
            <div>
                <h1>Best decision you've ever made 😄</h1>
                <p style="font-size:1.5rem;">I love you ❤️</p>
            </div>
        </div>
    `;
}

</script>

</body>
</html>
